name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devenv:
    name: devenv (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Check
        run: devenv test
      - name: Build native binary
        run: devenv shell -- bridge-build
      - name: Cross-build unsigned release candidates
        if: matrix.os == 'ubuntu-latest'
        run: devenv shell -- bridge-release
      - name: Check release archives and launchers
        if: matrix.os == 'ubuntu-latest'
        run: devenv shell -- bash packaging/check.sh
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: unsigned-release-candidates
          path: dist/release/
          if-no-files-found: error

  windows:
    # Nix/devenv on Windows requires WSL. Test the native Windows host directly.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and build
        shell: bash
        run: |
          bash scripts/check.sh
          bash scripts/build.sh
          node packaging/check.cjs --windows-launcher dist/xipu-bridge.exe

  release:
    name: Publish release downloads
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [devenv, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-release-candidates
          path: dist/release
      - name: Verify version and prepare downloads
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(jq -r .version extension/manifest.json)
          if [[ "$RELEASE_TAG" != "v$version" ]] &&
            ! { [[ "$RELEASE_TAG" == "v$version"-rc.* ]] && [[ "${RELEASE_TAG#"v$version-rc."}" =~ ^[1-9][0-9]*$ ]]; }; then
            echo "Release tag must match v$version or v$version-rc.N (N is a positive integer)." >&2
            exit 1
          fi
          cd dist/release
          sha256sum -c SHA256SUMS
          shopt -s nullglob
          assets=(xipu-ai-bridge_"$version"_*.zip xipu-ai-bridge_"$version"_*.tar.gz xipu-bridge-extension.zip)
          [[ ${#assets[@]} -eq 7 ]]
          mkdir -p "$RUNNER_TEMP/release-downloads"
          cp -- "${assets[@]}" "$RUNNER_TEMP/release-downloads/"
          cd "$RUNNER_TEMP/release-downloads"
          sha256sum -- "${assets[@]}" > SHA256SUMS
      - name: Publish verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release-downloads/"* \
            "${release_flags[@]}" \
            --verify-tag --title "XIPU AI Bridge $RELEASE_TAG" --generate-notes \
            --notes "Download both the native archive for your platform/CPU and \`xipu-bridge-extension.zip\`, extract them, and follow \`INSTALL.md\`. Prebuilt binaries are not Developer ID or Authenticode signed, or Apple notarized; your OS may warn or block execution."
